<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — TripMoree</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0f1117;--card:#1e2433;--gold:#f5c518;--text:#e2e8f0;--muted:#94a3b8;--border:#2d3748;--red:#ef4444;}
body{font-family:'Poppins',sans-serif;background:var(--bg);min-height:100vh;
     display:flex;align-items:center;justify-content:center;padding:20px;}

.login-wrap{width:100%;max-width:400px;}

.login-logo{text-align:center;margin-bottom:32px;}
.login-logo .icon{
  width:64px;height:64px;background:rgba(245,197,24,.12);
  border:1px solid rgba(245,197,24,.25);border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;color:var(--gold);margin:0 auto 14px;
}
.login-logo h1{font-size:22px;font-weight:700;color:var(--text);}
.login-logo p{font-size:13px;color:var(--muted);margin-top:4px;}

.login-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:32px;
  animation:fadeUp .5s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.flash-error{
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);
  color:var(--red);border-radius:8px;padding:11px 14px;
  font-size:13px;margin-bottom:20px;
  display:flex;align-items:center;gap:8px;
  animation:shake .4s ease;
}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}50%{transform:translateX(5px);}}

.form-group{margin-bottom:18px;}
.form-group label{
  display:block;font-size:11px;font-weight:600;
  color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:7px;
}
.input-wrap{position:relative;}
.input-wrap i{
  position:absolute;left:13px;top:50%;
  transform:translateY(-50%);color:var(--muted);font-size:15px;
}
.form-group input{
  width:100%;background:#252b3b;border:1px solid var(--border);
  color:var(--text);padding:11px 13px 11px 40px;
  border-radius:9px;font-size:13.5px;
  font-family:'Poppins',sans-serif;
  outline:none;transition:border-color .2s;
}
.form-group input:focus{border-color:var(--gold);}
.form-group input::placeholder{color:var(--muted);}

.btn-login{
  width:100%;padding:12px;background:var(--gold);
  border:none;border-radius:9px;color:#000;
  font-size:14px;font-weight:700;cursor:pointer;
  font-family:'Poppins',sans-serif;
  transition:all .2s;margin-top:4px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover{background:#e6b800;transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,197,24,.25);}
.btn-login:active{transform:translateY(0);}

.login-footer{text-align:center;margin-top:20px;font-size:12px;color:var(--muted);}
.login-footer a{color:var(--gold);text-decoration:none;}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="icon"><i class="fa-solid fa-plane"></i></div>
    <h1>TripMoree Admin</h1>
    <p>Sign in to manage your platform</p>
  </div>

  <div class="login-card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash-error">
          <i class="fa-solid fa-triangle-exclamation"></i> {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" name="username" placeholder="Admin username" required autofocus>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>
  </div>

  <div class="login-footer">
    <a href="{{ url_for('home') }}">← Back to site</a>
  </div>
</div>

</body>
</html>
